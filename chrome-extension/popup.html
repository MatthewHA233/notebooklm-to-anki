<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 380px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      background: #fafafa;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1a1a1a;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .status.info { background: #e8f4fd; color: #0c5fa5; }
    .status.success { background: #e6f9e6; color: #1a7a1a; }
    .status.error { background: #fde8e8; color: #a50c0c; }
    .status.warning { background: #fff8e1; color: #8a6d00; }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: #4a90d9;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button#extractBtn {
      background: #4a90d9;
      color: #fff;
    }
    button#extractBtn:hover:not(:disabled) {
      background: #3a7bc8;
    }
    button#extractBtn:disabled {
      background: #b0c4de;
      cursor: not-allowed;
    }
    .progress {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
    .progress .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ddd;
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1 data-i18n="title">NotebookLM to Anki</h1>

  <div id="serverStatus" class="status success" data-i18n="ready">
    Ready
  </div>

  <div class="field">
    <label for="deckName" data-i18n="deckLabel">Deck name</label>
    <input type="text" id="deckName" data-i18n-placeholder="deckPlaceholder" placeholder="Auto-detecting...">
  </div>

  <button id="extractBtn" data-i18n="extractBtn" style="width:100%;margin-bottom:8px">Extract & Generate</button>

  <div id="progress" class="progress">
    <span class="spinner"></span>
    <span id="progressText"></span>
  </div>

  <div class="footer">v2.0 - Pure Browser Extension</div>

  <!-- Vendor libraries -->
  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/jszip.min.js"></script>

  <!-- App modules -->
  <script src="lib/anki-config.js"></script>
  <script src="lib/anki-card-templates.js"></script>
  <script src="lib/quiz-transformer.js"></script>
  <script src="lib/anki-generator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
